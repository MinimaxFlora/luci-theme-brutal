name: Build packages

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.format }} / OpenWrt ${{ matrix.version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: 24.10.8
            format: ipk
          - version: 25.12.6
            format: apk
    steps:
      - name: Checkout theme
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bison flex gawk gettext git libncurses-dev \
            libssl-dev python3 rsync unzip wget xz-utils zlib1g-dev zstd

      - name: Resolve SDK
        id: sdk
        env:
          VERSION: ${{ matrix.version }}
        run: |
          set -euo pipefail
          base="https://downloads.openwrt.org/releases/${VERSION}/targets/x86/64"
          sums="$RUNNER_TEMP/sha256sums"
          curl -fsSL --http1.1 --retry 5 --retry-all-errors --connect-timeout 30 \
            "${base}/sha256sums" -o "${sums}"
          line="$(grep -E "  \*?openwrt-sdk-${VERSION}-x86-64_.*Linux-x86_64\.tar\.(xz|zst)$" "${sums}" | head -n 1)"
          if [ -z "${line}" ]; then
            echo "::error::No x86-64 SDK found for OpenWrt ${VERSION}"
            exit 1
          fi
          echo "sha256=$(printf '%s\n' "${line}" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "file=$(printf '%s\n' "${line}" | awk '{print $2}' | sed 's/^\*//')" >> "$GITHUB_OUTPUT"

      - name: Cache SDK archive
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: .cache/${{ steps.sdk.outputs.file }}
          key: openwrt-sdk-${{ steps.sdk.outputs.sha256 }}

      - name: Download and extract SDK
        env:
          SDK_FILE: ${{ steps.sdk.outputs.file }}
          SDK_SHA: ${{ steps.sdk.outputs.sha256 }}
          VERSION: ${{ matrix.version }}
        run: |
          set -euo pipefail
          mkdir -p .cache sdk
          archive=".cache/${SDK_FILE}"
          if [ -f "${archive}" ]; then
            printf '%s  %s\n' "${SDK_SHA}" "${archive}" | sha256sum -c - || rm -f "${archive}"
          fi
          if [ ! -f "${archive}" ]; then
            curl --http1.1 -fL --retry 5 --retry-all-errors --connect-timeout 30 --max-time 1800 \
              "https://downloads.openwrt.org/releases/${VERSION}/targets/x86/64/${SDK_FILE}" \
              -o "${archive}.part"
            printf '%s  %s\n' "${SDK_SHA}" "${archive}.part" | sha256sum -c -
            mv "${archive}.part" "${archive}"
          fi
          case "${SDK_FILE}" in
            *.tar.zst) tar --zstd -xf "${archive}" -C sdk --strip-components=1 ;;
            *.tar.xz)  tar -xJf "${archive}" -C sdk --strip-components=1 ;;
            *) echo "::error::Unsupported SDK archive ${SDK_FILE}"; exit 1 ;;
          esac

      - name: Prepare feeds
        working-directory: sdk
        run: |
          set -euo pipefail
          cp feeds.conf.default feeds.conf
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Stage theme package
        run: |
          set -euo pipefail
          rsync -a --delete \
            --exclude .git --exclude .cache --exclude sdk --exclude dist \
            "${GITHUB_WORKSPACE}/" sdk/package/luci-theme-brutal/

      - name: Configure
        working-directory: sdk
        run: |
          set -euo pipefail
          cat > .config <<'EOF'
          CONFIG_ALL=n
          CONFIG_ALL_KMODS=n
          CONFIG_ALL_NONSHARED=n
          CONFIG_AUTOREMOVE=n
          CONFIG_PACKAGE_luci-theme-brutal=m
          EOF
          sed -i 's/^[[:space:]]*//' .config
          make defconfig
          grep -qx 'CONFIG_PACKAGE_luci-theme-brutal=m' .config ||
            { echo "::error::defconfig dropped luci-theme-brutal"; exit 1; }

      - name: Compile
        working-directory: sdk
        run: make package/luci-theme-brutal/compile V=s

      - name: Collect and inspect
        env:
          FORMAT: ${{ matrix.format }}
        run: |
          set -euo pipefail
          mkdir -p dist
          find sdk/bin/packages -type f -name "*.${FORMAT}" -exec cp -v {} dist/ \;
          count="$(find dist -maxdepth 1 -type f -name "*.${FORMAT}" | wc -l)"
          if [ "${count}" -ne 1 ]; then
            echo "::error::Expected exactly one .${FORMAT} artifact, found ${count}"
            ls -l dist
            exit 1
          fi
          pkg="$(find dist -maxdepth 1 -type f -name "*.${FORMAT}" | head -n 1)"
          case "${FORMAT}" in
            ipk)
              tar -xzOf "${pkg}" ./control.tar.gz | tar -xzOf - ./control |
                grep -E '^(Package|Version|Architecture|Depends|Section):'
              ;;
            apk)
              sdk/staging_dir/host/bin/apk --allow-untrusted adbdump "${pkg}" |
                sed -n '1,40p'
              ;;
          esac

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: luci-theme-brutal-${{ matrix.format }}-${{ matrix.version }}
          path: dist/*

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -l dist
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
